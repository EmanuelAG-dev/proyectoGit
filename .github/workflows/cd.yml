name: CD - main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  bump-version:
    if: (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Incrementar la version del README
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import re

          path = Path("README.md")
          if not path.is_file():
              raise SystemExit("ERROR: crea README.md con AppVersion-0 antes de ejecutar CD.")

          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r"^AppVersion-(\d+)\b[^\n]*$", re.MULTILINE)
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit("ERROR: el README debe tener una unica linea AppVersion-N.")

          version = int(matches[0].group(1)) + 1
          date = datetime.now(ZoneInfo("Europe/Madrid")).strftime("%Y-%m-%d %H:%M:%S %Z")
          line = f"AppVersion-{version} | {date}"
          path.write_text(pattern.sub(line, text, count=1), encoding="utf-8")
          print(line)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Incrementar version de la aplicacion"
          git push origin HEAD:refs/heads/main

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    steps:
      - name: Comparar el token de produccion
        shell: bash
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if [ -z "${PROD_TOKEN:-}" ] || [ -z "${LOCAL_PROD_TOKEN:-}" ]; then
            echo "ERROR: falta PROD_TOKEN o LOCAL_PROD_TOKEN."
            exit 1
          fi

          if [ "$PROD_TOKEN" = "$LOCAL_PROD_TOKEN" ]; then
            echo "Validacion correcta: los tokens de produccion coinciden."
          else
            echo "ERROR: los tokens de produccion no coinciden."
            exit 1
          fi
