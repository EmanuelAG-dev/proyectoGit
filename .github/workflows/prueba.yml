# Prueba con tokens diferentes
name: Prueba de tokens

on: [push]

jobs:
  comprobar-token:
    runs-on: self-hosted

    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: bash
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if [ -z "$DEV_TOKEN" ] || [ -z "${LOCAL_DEV_TOKEN:-}" ]; then
            echo "Error: falta configurar uno de los tokens."
            exit 1
          fi

          if [ "$DEV_TOKEN" = "$LOCAL_DEV_TOKEN" ]; then
            echo "Los tokens coinciden."
            exit 0
          else
            echo "Error: los tokens no coinciden."
            exit 1
          fi
